"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = "bash scripts/conductor-setup.sh"
run_mode = "concurrent"

[scripts.run.dev]
available_in = [ "local" ]
command = "bash scripts/dev.sh"
default = true
icon = "play"

[scripts.run.test]
command = "bash scripts/test.sh"
icon = "test-tube"
